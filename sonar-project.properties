# ============================================================
# SonarQube - Laravel (PHP)
# Host URL & token otomatis disuntik oleh withSonarQubeEnv('SonarQube')
# ============================================================
sonar.projectKey=ifs24005-pabwe2026-sk-p7-laravel-livewire
sonar.projectName=ifs24005-pabwe2026-sk-p7-laravel-livewire
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Kode yang dianalisis
sonar.sources=app,routes,database,resources
sonar.tests=tests

# Jangan dianalisis
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,coverage/**,.trivy-cache/**,database/migrations/**,resources/views/**

# Coverage dari: php artisan test --coverage-clover=coverage/clover.xml
sonar.php.coverage.reportPaths=coverage/clover.xml